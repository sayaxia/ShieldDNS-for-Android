buildscript {
    repositories {
        // 阿里云镜像只给本地开发用；CI 走官方源，避免镜像返回坏 POM / 限流把构建打挂
        if (System.getenv('CI') == null) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

allprojects {
    repositories {
        if (System.getenv('CI') == null) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}

// 版本号单一来源。改版本只改这里；CI 用 -PversionName / -PversionCode 按 tag 覆盖。
ext {
    appVersionCode = (project.findProperty('versionCode') ?: 35).toInteger()
    appVersionName = (project.findProperty('versionName') ?: '0.3.0').toString()
}
