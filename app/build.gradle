apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 签名参数不进仓库：本地放 signing.properties（已 gitignore），CI 由 Secrets 生成同名文件。
// 仓库里没有这个文件时 release 只能出未签名包 —— 这是故意的，避免私钥跟代码一起走。
def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
def hasSigning = signingPropsFile.exists()
if (hasSigning) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

// 内网 HTTPS 中间人环境（如构建沙箱）才需要额外 CA；找不到就跳过，正常机器无感。
def trustStorePath = System.getenv('SHIELDDNS_TRUSTSTORE')
if (!trustStorePath) {
    def localTs = rootProject.file('truststore.jks')
    if (localTs.exists()) trustStorePath = localTs.absolutePath
}

android {
    namespace 'com.shielddns.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shielddns.android'
        minSdk 26
        targetSdk 34
        // 版本号单一来源在根 build.gradle 的 ext，支持 -PversionName 覆盖（CI 按 tag 注入）
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(signingProps.getProperty('storeFile', 'keystore/shielddns.jks'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                if (trustStorePath) {
                    systemProperty 'javax.net.ssl.trustStore', trustStorePath
                    systemProperty 'javax.net.ssl.trustStorePassword',
                            System.getenv('SHIELDDNS_TRUSTSTORE_PASS') ?: 'changeit'
                }
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
}
