apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.shielddns.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shielddns.android'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        local {
            storeFile file('../keystore/shielddns.jks')
            storePassword 'shielddns'
            keyAlias 'shielddns'
            keyPassword 'shielddns'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.local
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'javax.net.ssl.trustStore', '/home/user/toolchain/truststore.jks'
                systemProperty 'javax.net.ssl.trustStorePassword', 'changeit'
                maxHeapSize = '2g'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
}
